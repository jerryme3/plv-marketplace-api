<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
        }

        .login-card {
            width: min(360px, calc(100% - 32px));
            padding: 32px;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid #c8c8c8;
            border-radius: 4px;
            font: inherit;
        }

        button {
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 4px;
            color: #ffffff;
            background: #2563eb;
            font: inherit;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        #message {
            min-height: 20px;
            margin: 16px 0 0;
            text-align: center;
        }

        .error {
            color: #b91c1c;
        }

        .success {
            color: #15803d;
        }
    </style>
</head>
<body>
<main class="login-card">
    <h1>Login</h1>
    <form id="loginForm">
        <label for="email">
            Email
            <input id="email" name="email" type="email" autocomplete="email" required>
        </label>

        <label for="password">
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
        </label>

        <button id="loginButton" type="submit">Login</button>
        <p id="message" role="status" aria-live="polite"></p>
    </form>
</main>
<script src="login.js"></script>
</body>
</html>
